<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" font-family="system-ui, Segoe UI, sans-serif">
  <rect width="780" height="250" fill="#f7f4ef"/>
  <text x="16" y="22" font-size="15" font-weight="700" fill="#1a1a1a">Active arms. + rises, − falls. |δ| is the same on every active arm.</text>

  <!-- helper coordinates: three bridges -->
  <!-- QUARTER cx=130 -->
  <text x="130" y="48" text-anchor="middle" font-size="13" font-weight="700">Quarter  ·  Eo/E ≈ δ/4</text>
  <line x1="70" y1="70" x2="190" y2="70" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="70" y1="170" x2="190" y2="170" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="100" y1="70" x2="100" y2="170" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="160" y1="70" x2="160" y2="170" stroke="#1a1a1a" stroke-width="1.6"/>
  <rect x="92" y="88" width="16" height="8" fill="#fff" stroke="#1a1a1a"/>
  <rect x="92" y="140" width="16" height="8" fill="#fff" stroke="#1a1a1a"/>
  <rect x="152" y="88" width="16" height="8" fill="#f3d2bf" stroke="#c45c26" stroke-width="1.6"/>
  <rect x="152" y="140" width="16" height="8" fill="#fff" stroke="#1a1a1a"/>
  <text x="78" y="96" font-size="11">R</text>
  <text x="78" y="148" font-size="11">R</text>
  <text x="172" y="96" font-size="11" fill="#c45c26" font-weight="700">+</text>
  <text x="172" y="148" font-size="11">R</text>

  <!-- HALF -->
  <text x="390" y="48" text-anchor="middle" font-size="13" font-weight="700">Half  ·  Eo/E = δ/2</text>
  <line x1="330" y1="70" x2="450" y2="70" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="330" y1="170" x2="450" y2="170" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="360" y1="70" x2="360" y2="170" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="420" y1="70" x2="420" y2="170" stroke="#1a1a1a" stroke-width="1.6"/>
  <rect x="352" y="88" width="16" height="8" fill="#fff" stroke="#1a1a1a"/>
  <rect x="352" y="140" width="16" height="8" fill="#fff" stroke="#1a1a1a"/>
  <rect x="412" y="88" width="16" height="8" fill="#f3d2bf" stroke="#c45c26" stroke-width="1.6"/>
  <rect x="412" y="140" width="16" height="8" fill="#d5e6f0" stroke="#2a6f97" stroke-width="1.6"/>
  <text x="338" y="96" font-size="11">R</text>
  <text x="338" y="148" font-size="11">R</text>
  <text x="432" y="96" font-size="11" fill="#c45c26" font-weight="700">+</text>
  <text x="432" y="148" font-size="11" fill="#2a6f97" font-weight="700">−</text>

  <!-- FULL -->
  <text x="650" y="48" text-anchor="middle" font-size="13" font-weight="700">Full  ·  Eo/E = δ</text>
  <line x1="590" y1="70" x2="710" y2="70" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="590" y1="170" x2="710" y2="170" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="620" y1="70" x2="620" y2="170" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="680" y1="70" x2="680" y2="170" stroke="#1a1a1a" stroke-width="1.6"/>
  <rect x="612" y="88" width="16" height="8" fill="#d5e6f0" stroke="#2a6f97" stroke-width="1.6"/>
  <rect x="612" y="140" width="16" height="8" fill="#f3d2bf" stroke="#c45c26" stroke-width="1.6"/>
  <rect x="672" y="88" width="16" height="8" fill="#f3d2bf" stroke="#c45c26" stroke-width="1.6"/>
  <rect x="672" y="140" width="16" height="8" fill="#d5e6f0" stroke="#2a6f97" stroke-width="1.6"/>
  <text x="596" y="96" font-size="11" fill="#2a6f97" font-weight="700">−</text>
  <text x="596" y="148" font-size="11" fill="#c45c26" font-weight="700">+</text>
  <text x="692" y="96" font-size="11" fill="#c45c26" font-weight="700">+</text>
  <text x="692" y="148" font-size="11" fill="#2a6f97" font-weight="700">−</text>

  <text x="16" y="210" font-size="12" fill="#333">Opposite corners carry the same sign. A temperature rise that increases every gauge by the same fraction then cancels in the full bridge.</text>
  <text x="16" y="230" font-size="12" fill="#555">Supply on the left vertical. Detector between the two midpoints. δ = ΔR/R.</text>
</svg>
