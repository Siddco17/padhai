<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="system-ui, Segoe UI, sans-serif">
  <rect width="720" height="360" fill="#f7f4ef"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1a1a1a">Schering bridge</text>
  <text x="20" y="48" font-size="12" fill="#555">Unknown capacitor with its loss resistance. Detector at null.</text>

  <line x1="90" y1="80" x2="560" y2="80" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="90" y1="270" x2="560" y2="270" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="90" y1="80" x2="90" y2="270" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="560" y1="80" x2="560" y2="270" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Z1: rx series Cx, top-left vertical -->
  <line x1="230" y1="80" x2="230" y2="100" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="214" y="100" width="32" height="12" fill="#fff" stroke="#c45c26" stroke-width="2"/>
  <line x1="230" y1="112" x2="230" y2="132" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="218" y1="132" x2="242" y2="132" stroke="#c45c26" stroke-width="2"/>
  <line x1="218" y1="140" x2="242" y2="140" stroke="#c45c26" stroke-width="2"/>
  <line x1="230" y1="140" x2="230" y2="175" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Z2: C2 top-right -->
  <line x1="430" y1="80" x2="430" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="418" y1="120" x2="442" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="418" y1="128" x2="442" y2="128" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="430" y1="128" x2="430" y2="175" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Z3 R3 bottom-left -->
  <line x1="230" y1="195" x2="230" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="214" y="220" width="32" height="12" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="230" y1="232" x2="230" y2="270" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Z4 parallel R4 C4 bottom-right -->
  <line x1="430" y1="195" x2="430" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="400" y1="210" x2="460" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="408" y1="210" x2="408" y2="222" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="396" y="222" width="24" height="12" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="408" y1="234" x2="408" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="452" y1="210" x2="452" y2="222" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="444" y1="222" x2="460" y2="222" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="444" y1="230" x2="460" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="452" y1="230" x2="452" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="400" y1="250" x2="460" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="430" y1="250" x2="430" y2="270" stroke="#1a1a1a" stroke-width="2"/>

  <!-- detector -->
  <line x1="230" y1="185" x2="300" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="360" y1="185" x2="430" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="330" cy="185" r="20" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="330" y="189" text-anchor="middle" font-size="11" font-weight="700">D</text>

  <!-- source -->
  <text x="48" y="180" font-size="16" font-weight="700" fill="#1a1a1a">~</text>
  <text x="18" y="200" font-size="12" fill="#555">AC</text>

  <text x="250" y="112" font-size="13" font-weight="700" fill="#c45c26">rx</text>
  <text x="250" y="142" font-size="13" font-weight="700" fill="#c45c26">Cx</text>
  <text x="450" y="126" font-size="13" font-weight="700">C2</text>
  <text x="188" y="232" font-size="13" font-weight="700">R3</text>
  <text x="368" y="234" font-size="12" font-weight="700">R4</text>
  <text x="466" y="230" font-size="12" font-weight="700">C4</text>

  <text x="20" y="310" font-size="13" fill="#1a1a1a">Cx = C2 (R4 / R3)     rx = R3 (C4 / C2)     D = ω C4 R4</text>
  <text x="20" y="332" font-size="12" fill="#555">D does not contain Cx or rx. That is why this bridge is used for loss.</text>
</svg>
