<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, Segoe UI, sans-serif">
  <rect width="720" height="340" fill="#f7f4ef"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1a1a1a">Wheatstone deflection bridge</text>
  <text x="20" y="48" font-size="12" fill="#555">Thermistor sits bottom-right. Output rises when that resistance falls.</text>

  <!-- rails -->
  <line x1="80" y1="90" x2="560" y2="90" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="80" y1="250" x2="560" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="80" y1="90" x2="80" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="560" y1="90" x2="560" y2="250" stroke="#1a1a1a" stroke-width="2"/>

  <!-- left branch resistors -->
  <line x1="230" y1="90" x2="230" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="214" y="120" width="32" height="14" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="230" y1="134" x2="230" y2="206" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="214" y="206" width="32" height="14" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="230" y1="220" x2="230" y2="250" stroke="#1a1a1a" stroke-width="2"/>

  <!-- right branch -->
  <line x1="430" y1="90" x2="430" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="414" y="120" width="32" height="14" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="430" y1="134" x2="430" y2="206" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="400" y="200" width="60" height="28" rx="4" fill="#fff4e8" stroke="#c45c26" stroke-width="2"/>
  <line x1="430" y1="228" x2="430" y2="250" stroke="#1a1a1a" stroke-width="2"/>

  <!-- detector -->
  <line x1="230" y1="170" x2="300" y2="170" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="360" y1="170" x2="430" y2="170" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="330" cy="170" r="22" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="330" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Eo</text>

  <!-- supply -->
  <line x1="80" y1="170" x2="40" y2="170" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="28" cy="150" r="10" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="28" y="154" text-anchor="middle" font-size="12" font-weight="700">+</text>
  <line x1="28" y1="160" x2="28" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="28" cy="242" r="10" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="28" y="246" text-anchor="middle" font-size="14" font-weight="700">−</text>
  <line x1="28" y1="252" x2="28" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="80" y1="250" x2="28" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <text x="8" y="200" font-size="13" font-weight="700" fill="#1a1a1a">Vs</text>

  <text x="248" y="132" font-size="14" font-weight="700" fill="#1a1a1a">R3</text>
  <text x="248" y="218" font-size="14" font-weight="700" fill="#1a1a1a">R2</text>
  <text x="448" y="132" font-size="14" font-weight="700" fill="#1a1a1a">R4</text>
  <text x="430" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#c45c26">Rθ</text>

  <text x="80" y="300" font-size="13" fill="#1a1a1a">Eo / Vs = R2/(R2+R3) − Rθ/(Rθ+R4)</text>
  <text x="80" y="322" font-size="12" fill="#555">Balance (Eo = 0): R4 / Rθ = R3 / R2</text>
</svg>
