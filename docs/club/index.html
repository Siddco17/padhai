<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1f16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Chip club course · padhai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1a1f16;
      --bg-elev: #242b1f;
      --bg-card: #2c3426;
      --line: #3d4734;
      --text: #e8eadf;
      --muted: #a3ad96;
      --accent: #d4a017;
      --accent-soft: rgba(212, 160, 23, 0.14);
      --ok: #7cb87c;
      --warn: #e0a06a;
      --danger: #d97b6c;
      --radius: 14px;
      --font: "IBM Plex Sans", system-ui, sans-serif;
      --display: "Fraunces", Georgia, serif;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      background:
        radial-gradient(900px 480px at 8% -10%, #2f3a24 0%, transparent 55%),
        radial-gradient(700px 420px at 100% 0%, #3a2e14 0%, transparent 46%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100dvh;
    }
    a { color: var(--accent); }
    button, input { font: inherit; color: inherit; }
    .wrap { width: min(640px, 100%); margin: 0 auto; padding: 1rem 1rem calc(1.5rem + var(--safe-bottom)); }
    .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin: 0;
    }
    h1, h2, h3 { font-family: var(--display); font-weight: 560; letter-spacing: -0.02em; }
    h1 { font-size: clamp(1.7rem, 6vw, 2.2rem); margin: 0.2rem 0 0.35rem; }
    h2 { font-size: 1.35rem; margin: 0 0 0.35rem; }
    h3 { font-size: 1.05rem; margin: 0 0 0.35rem; }
    p { margin: 0.4rem 0; }
    .muted { color: var(--muted); }
    .small { font-size: 0.86rem; }
    .bar {
      height: 8px;
      background: var(--bg-elev);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--line);
      margin: 0.7rem 0 0.3rem;
    }
    .bar > span { display: block; height: 100%; background: var(--accent); width: 0; }
    .track-label { margin: 1.3rem 0 0.45rem; }
    .row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.75rem;
      align-items: center;
      width: 100%;
      text-align: left;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.75rem 0.8rem;
      margin: 0 0 0.5rem;
      cursor: pointer;
    }
    .row.done { border-color: #3f5a3f; }
    .row.current { border-color: var(--accent); background: var(--accent-soft); }
    .row.locked { opacity: 0.48; cursor: not-allowed; }
    .badge {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      font-weight: 600;
      background: var(--bg-elev);
    }
    .row.done .badge { color: var(--ok); border-color: #3f5a3f; }
    .row.current .badge { color: var(--accent); border-color: var(--accent); }
    .status { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.8rem;
    }
    .ghost, .primary, .choice {
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg-elev);
      padding: 0.55rem 0.9rem;
      cursor: pointer;
    }
    .primary { background: var(--accent); color: #1a1f16; border-color: var(--accent); font-weight: 600; }
    .primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .steps { display: flex; gap: 0.35rem; flex-wrap: wrap; margin: 0.6rem 0 0.9rem; }
    .step {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 0.28rem 0.65rem;
      cursor: pointer;
    }
    .step.on { color: #1a1f16; background: var(--accent); border-color: var(--accent); }
    .step:disabled { opacity: 0.4; cursor: not-allowed; }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      margin: 0.6rem 0;
    }
    .read-item { margin: 0.55rem 0; }
    .book { color: var(--accent); font-weight: 600; }
    .fig {
      width: 100%;
      height: auto;
      background: #1e241b;
      border-radius: 12px;
      border: 1px solid var(--line);
      display: block;
    }
    .shot { margin: 0.75rem 0 0.2rem; }
    .shot img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
    }
    .shot figcaption { margin-top: 0.3rem; }
    .eq {
      font-family: var(--display);
      background: var(--bg-elev);
      border-radius: 10px;
      padding: 0.45rem 0.7rem;
      margin: 0.45rem 0;
    }
    fieldset {
      border: 1px solid var(--line);
      border-radius: 12px;
      margin: 0.7rem 0;
      padding: 0.7rem 0.8rem 0.4rem;
    }
    legend { padding: 0 0.3rem; font-weight: 600; }
    .choice {
      display: flex;
      gap: 0.55rem;
      align-items: flex-start;
      width: 100%;
      border-radius: 10px;
      margin: 0.35rem 0;
      text-align: left;
    }
    .choice.right { border-color: #3f5a3f; color: var(--ok); }
    .choice.wrong { border-color: #6a3d36; color: var(--danger); }
    label.field { display: block; margin: 0.7rem 0; font-weight: 600; }
    input[type="text"], input[type="number"] {
      display: block;
      width: 100%;
      margin-top: 0.3rem;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.6rem 0.7rem;
      font-weight: 500;
    }
    .ok { color: var(--ok); }
    .bad { color: var(--danger); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.8rem; }
    .cert {
      border: 1px solid var(--accent);
      background:
        linear-gradient(180deg, rgba(212, 160, 23, 0.12), transparent 40%),
        var(--bg-card);
      border-radius: 18px;
      padding: 1.1rem 1rem 0.8rem;
      margin: 0.8rem 0;
    }
    .cert ol { margin: 0.4rem 0 0.2rem; padding-left: 1.2rem; }
    .why { color: var(--muted); font-size: 0.86rem; margin: 0.25rem 0 0.45rem; }
    ul.clean { margin: 0.3rem 0; padding-left: 1.1rem; }
  </style>
</head>

          <p>Gray order on both axes. Groups of 2^k only. Edges wrap. A group of 2^k removes k variables. Use a don’t-care only when it enlarges a group. Never pull a 0 into an SOP group.</p>

          <p>On an adder–subtractor, M = 0 adds. M = 1 inverts B and sets C0 = 1, which adds the 2’s complement.</p>

        quiz: [

          { q: "Full-adder carry is 1 when", choices: ["All three inputs are 0", "Exactly one input is 1", "At least two inputs are 1", "The sum is 0"], answer: 2, why: "Majority. Cout = AB + BCin + ACin." },
          { q: "M = 1 on an adder–subtractor", choices: ["Adds B", "Inverts B and sets the first carry to 1", "Disables the adder", "Swaps sum and carry"], answer: 1, why: "That is a 2’s-complement subtraction." },
          { q: "Leftover-variable MUX data pins are wired to", choices: ["0, 1, D, or D'", "Only the minterms", "Clock and reset", "The carry chain"], answer: 0, why: "Select takes all but one variable. The last variable shows up as D or D' on a data pin." }
        ],
        numerical: {
          prompt: "Full adder. A = 1, B = 1, Cin = 1. Sum and carry, each 0 or 1.",
          fields: [
            { key: "sum", label: "Sum", target: 1, tol: 0 },
            { key: "cout", label: "Carry", target: 1, tol: 0 }
          ],

      },
      {
        id: 10, track: "semester", title: "GBW and CMRR", minutes: 40,
        read: [
          { book: "Boylestad 11e", pages: "printed pp. 631–634", note: "§10.7 Frequency parameters. Gain–bandwidth." },

        ],
        seeTitle: "One product, two gains",
        see: `<p>For a compensated op-amp the closed-loop bandwidth is the gain–bandwidth product divided by the closed-loop gain.</p>
          <p class="eq">f3dB = GBW / G &nbsp;&nbsp; GBW = G · f3dB</p>
          <p>Common-mode and differential:</p>
          <p class="eq">vd = v1 − v2 &nbsp;&nbsp; vc = (v1 + v2) / 2</p>
          <p class="eq">CMRR = Ad / Acm &nbsp;&nbsp; CMRR(dB) = 20 log10(Ad / Acm)</p>
          <p class="eq">vo = Ad vd + Acm vc</p>
          <p>100 dB is a ratio of 10^5, not 100. The September paper’s Q4 and Q5 are the numerical below.</p>`,
        fig: "gbw",
        figCap: "Halving the gain doubles the bandwidth. The corner still meets the same slope.",
        quiz: [
          { q: "Closed-loop 3 dB frequency is", choices: ["GBW × G", "GBW / G", "G / GBW", "Always the open-loop bandwidth"], answer: 1, why: "More gain, less bandwidth, on one product." },
          { q: "CMRR is", choices: ["Ad / Acm", "Acm / Ad", "Ad + Acm", "20 log vd"], answer: 0, why: "The ratio of differential gain to common-mode gain. Decibels are 20 log of that." },
          { q: "100 dB is a ratio of", choices: ["100", "1000", "10^5", "2"], answer: 2, why: "20 log10(10^5) = 100. A factor of 100 would be 40 dB." },
          { q: "Common-mode input is", choices: ["v1 − v2", "(v1 + v2) / 2", "v1 + v2", "Ad / 2"], answer: 1, why: "The part that is the same on both inputs. The difference is vd." }
        ],

      {

        see: `<p>Two matched transistors share one tail current. Bases near ground, emitter resistor down to −VEE:</p>
          <p class="eq">IT = (|VEE| − 0.7) / RE &nbsp;&nbsp; IE1 = IE2 = IT / 2</p>
          <p>re uses that half current, not the whole tail. A current mirror sets IT from a reference and holds a high AC tail resistance, which cuts common-mode gain and raises CMRR. Differential gain barely moves.</p>
          <p>The September photo of the whole multi-transistor chain is still a paper job after this. Do that Q6 from the photo once this number is easy.</p>`,

          { q: "re of each device uses", choices: ["The whole tail current", "IT / 2", "IC of the mirror reference only", "VCC / RC"], answer: 1, why: "Each emitter carries half the tail." },

          { q: "A mirror-set tail is about", choices: ["Equal to the reference current", "β times the reference", "Zero at AC and DC", "VBE / β"], answer: 0, why: "Iref = (VCC − VBE) / R, and IT ≈ Iref." }

          prompt: "RE = 10 kΩ down to VEE = −8 V. Tail current IT, and each emitter current, in mA.",

            { key: "ie", label: "Each IE (mA)", target: 0.365, tol: 0.01 }

    const STEPS = ["read", "see", "quiz", "num"];
    const STEP_LABEL = { read: "Read", see: "See", quiz: "Quiz", num: "Numerical" };

    let state = load();
    let view = { name: "path" };
    let quizPick = {};
    let quizGraded = null;
    let forceQuiz = false;
    let numShown = false;

    function load() {
      try {
        const raw = JSON.parse(localStorage.getItem(KEY) || "{}");
        return {
          quiz: raw.quiz || {},
          num: raw.num || {},
          clubAt: raw.clubAt || null,
          semAt: raw.semAt || null
        };
      } catch (e) {
        return { quiz: {}, num: {}, clubAt: null, semAt: null };
      }
    }
    function save() {
      localStorage.setItem(KEY, JSON.stringify(state));
    }
    function lessonPassed(id) {
      return !!(state.quiz[id] && state.num[id]);
    }
    function clubDone() {
      return LESSONS.filter(l => l.track === "club").every(l => lessonPassed(l.id));
    }
    function semDone() {
      return LESSONS.every(l => lessonPassed(l.id));
    }
    function unlocked(lesson) {
      if (lesson.track === "semester") return clubDone();
      const prev = LESSONS.filter(l => l.track === "club" && l.id < lesson.id);
      return prev.every(l => lessonPassed(l.id));
    }
    function stampCerts() {
      if (clubDone() && !state.clubAt) state.clubAt = new Date().toISOString();
      if (semDone() && !state.semAt) state.semAt = new Date().toISOString();
      save();
    }
    function esc(s) {
      return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }
    function normSop(raw) {
      let s = String(raw).toLowerCase().replace(/[’′]/g, "'").replace(/\s+/g, "");
      s = s.replace(/^f=/, "");
      s = s.replace(/b'\(c'\+d'\)/g, "b'c'+b'd'");
      s = s.replace(/b'\(d'\+c'\)/g, "b'd'+b'c'");
      const terms = s.split("+").filter(Boolean).map(term => {
        const lits = term.match(/[a-d]'?/g) || [];
        return lits.sort().join("");
      }).sort();
      return terms.join("+");
    }
    const SOP_OK = normSop("b'd'+b'c'+a'c'd");

    function render() {
      const app = document.getElementById("app");
      if (view.name === "path") app.innerHTML = pathHtml();
      else if (view.name === "cert") app.innerHTML = certHtml(view.which);
      else app.innerHTML = lessonHtml();
      bind();
    }

    function pathHtml() {
      const club = LESSONS.filter(l => l.track === "club");
      const n = club.filter(l => lessonPassed(l.id)).length;
      const current = LESSONS.find(l => unlocked(l) && !lessonPassed(l.id));
      return `
        <p class="eyebrow">padhai · certificate path</p>
        <h1>Chip club</h1>
        <p class="muted">Read the printed pages, look at the figure, then pass the quiz and the numerical. Page numbers are the ones printed on the paper. If a viewer counts the cover, add 21 for Boylestad, 18 for Mano, and 24 for Alexander.</p>
        <div class="bar" aria-hidden="true"><span style="width:${(n / 9) * 100}%"></span></div>
        <p class="small muted">${n} of 9 club lessons passed${clubDone() ? " · semester path open" : ""}</p>
        ${certBanner()}
        <h2 class="track-label">Before the interview</h2>
        ${club.map(l => rowHtml(l, current)).join("")}
        <h2 class="track-label">After the interview</h2>
        <p class="small muted">September ACD paper. Opens when lessons 1–9 are passed.</p>
        ${LESSONS.filter(l => l.track === "semester").map(l => rowHtml(l, current)).join("")}
        <p class="small muted"><a href="../">Back to the guide</a></p>`;
    }
    function certBanner() {
      let html = "";
      if (state.clubAt) html += `<div class="card"><h3>Club path complete</h3><p class="small muted">${new Date(state.clubAt).toLocaleString()}</p><button class="primary" data-cert="club" type="button">View certificate</button></div>`;
      if (state.semAt) html += `<div class="card"><h3>Semester path complete</h3><p class="small muted">${new Date(state.semAt).toLocaleString()}</p><button class="primary" data-cert="sem" type="button">View certificate</button></div>`;
      return html;
    }
    function rowHtml(lesson, current) {
      const open = unlocked(lesson);
      const done = lessonPassed(lesson.id);
      const cls = done ? "done" : !open ? "locked" : (current && current.id === lesson.id ? "current" : "");
      const status = done ? "Passed" : !open ? "Locked" : "Open";
      return `<button class="row ${cls}" type="button" data-open="${lesson.id}" ${open ? "" : "disabled"}>
        <span class="badge">${done ? "✓" : lesson.id}</span>
        <span><strong>${esc(lesson.title)}</strong><br><span class="small muted">${lesson.minutes} min</span></span>
        <span class="status">${status}</span>
      </button>`;
    }
    function certHtml(which) {
      const list = which === "club" ? LESSONS.filter(l => l.track === "club") : LESSONS;
      const when = which === "club" ? state.clubAt : state.semAt;
      const title = which === "club" ? "Club path" : "Semester path";
      return `
        <div class="top"><button class="ghost" type="button" data-nav="path">Path</button></div>
        <article class="cert">
          <p class="eyebrow">padhai · chip club</p>
          <h2>${title}</h2>
          <p>${which === "club" ? "Lessons 1–9 passed. The viva blocks and the EDC hole they share." : "Lessons 1–11 passed, including GBW, CMRR, and the diff-pair tail."}</p>
          <p class="small muted">${when ? new Date(when).toLocaleString() : ""}</p>
          <ol>${list.map(l => `<li>${esc(l.title)}</li>`).join("")}</ol>
        </article>`;
    }
    function lessonById(id) {
      return LESSONS.find(l => l.id === id);
    }
    function stepOpen(lesson, step) {
      if (step === "read" || step === "see") return true;
      if (step === "quiz") return true;
      return !!state.quiz[lesson.id];
    }
    function lessonHtml() {
      const lesson = lessonById(view.id);
      const step = view.step;
      return `
        <div class="top">
          <button class="ghost" type="button" data-nav="path">Path</button>
          <span class="small muted">${lesson.track === "club" ? "Club" : "Semester"} · ${lesson.minutes} min</span>
        </div>
        <p class="eyebrow">Lesson ${lesson.id} of 11</p>
        <h1>${esc(lesson.title)}</h1>
        <div class="steps">
          ${STEPS.map(s => `<button class="step ${s === step ? "on" : ""}" type="button" data-step="${s}" ${stepOpen(lesson, s) ? "" : "disabled"}>${STEP_LABEL[s]}</button>`).join("")}
        </div>
        ${step === "read" ? readHtml(lesson) : ""}
        ${step === "see" ? seeHtml(lesson) : ""}
        ${step === "quiz" ? quizHtml(lesson) : ""}
        ${step === "num" ? numHtml(lesson) : ""}`;
    }
    function readHtml(lesson) {
      return `<p>These are the pages. Skip anything the note does not name.</p>
        ${lesson.read.map((r, i) => `<article class="card read-item"><p class="book">${esc(r.book)}</p><p>${esc(r.pages)}</p><p class="muted">${esc(r.note)}</p>
          ${(SHOTS[lesson.id + "-" + i] || []).map(([src, cap]) => `<figure class="shot"><img src="figures/${src}" alt="${esc(cap)}" loading="lazy" onerror="this.parentElement.remove()"><figcaption class="small muted">${esc(cap)}</figcaption></figure>`).join("")}
        </article>`).join("")}
        <div class="actions"><button class="primary" type="button" data-step="see">I have the pages</button></div>`;
    }
    function seeHtml(lesson) {
      return `<h2>${esc(lesson.seeTitle)}</h2>${lesson.see}
        ${FIG[lesson.fig]}
        <p class="small muted">${esc(lesson.figCap)}</p>
        <div class="actions"><button class="primary" type="button" data-step="quiz">Quiz</button></div>`;
    }
    function quizHtml(lesson) {
      if (state.quiz[lesson.id] && !quizGraded && !forceQuiz) {
        return `<p class="ok">Quiz already passed.</p><div class="actions"><button class="primary" type="button" data-step="num">Numerical</button><button class="ghost" type="button" id="redo-quiz">Redo</button></div>`;
      }
      const graded = quizGraded && quizGraded.id === lesson.id;
      return `<p class="small muted">Four questions. Three correct opens the numerical.</p>
        ${lesson.quiz.map((item, i) => `<fieldset><legend>${i + 1}. ${esc(item.q)}</legend>
          ${item.choices.map((c, j) => {
            let cls = "choice";
            if (graded && j === item.answer) cls += " right";
            else if (graded && quizPick[i] === j && j !== item.answer) cls += " wrong";
            return `<label class="${cls}"><input type="radio" name="q${i}" value="${j}" ${quizPick[i] === j ? "checked" : ""} ${graded ? "disabled" : ""}/> <span>${esc(c)}</span></label>`;
          }).join("")}
          ${graded ? `<p class="why">${esc(item.why)}</p>` : ""}
        </fieldset>`).join("")}
        ${graded ? `<p class="${quizGraded.ok ? "ok" : "bad"}">${quizGraded.score} of 4.</p>` : ""}
        <div class="actions">
          ${graded && quizGraded.ok ? `<button class="primary" type="button" data-step="num">Numerical</button>` : ""}
          ${graded && !quizGraded.ok ? `<button class="primary" type="button" id="redo-quiz">Try again</button>` : ""}
          ${!graded ? `<button class="primary" type="button" id="grade-quiz">Check</button>` : ""}
        </div>`;
    }
    function numHtml(lesson) {
      const n = lesson.numerical;
      const done = !!state.num[lesson.id];
      return `<p>${esc(n.prompt)}</p>
        ${n.fields.map(f => `<label class="field">${esc(f.label)}<input type="text" inputmode="${n.kind === "sop" ? "text" : "decimal"}" data-field="${f.key}" autocomplete="off"/></label>`).join("")}
        <div class="actions">
          <button class="primary" type="button" id="grade-num">Check</button>
          <button class="ghost" type="button" id="show-num">Show the worked solution</button>
        </div>
        <div id="num-out"></div>
        ${done ? `<p class="ok">This lesson is passed.</p><div class="actions"><button class="primary" type="button" data-nav="path">Back to the path</button></div>` : ""}
        ${numShown ? `<article class="card"><p>${esc(n.solution)}</p></article>` : ""}`;
    }

    function bind() {
      document.querySelectorAll("[data-open]").forEach(btn => {
        btn.addEventListener("click", () => {
          const lesson = lessonById(Number(btn.dataset.open));
          if (!unlocked(lesson)) return;
          quizPick = {};
          quizGraded = null;
          forceQuiz = false;
          numShown = false;
          view = { name: "lesson", id: lesson.id, step: "read" };
          render();
        });
      });
      document.querySelectorAll("[data-nav]").forEach(btn => {
        btn.addEventListener("click", () => {
          view = { name: btn.dataset.nav };
          render();
        });
      });
      document.querySelectorAll("[data-cert]").forEach(btn => {
        btn.addEventListener("click", () => {
          view = { name: "cert", which: btn.dataset.cert };
          render();
        });
      });
      document.querySelectorAll("[data-step]").forEach(btn => {
        btn.addEventListener("click", () => {
          const lesson = lessonById(view.id);
          const step = btn.dataset.step;
          if (!stepOpen(lesson, step)) return;
          view.step = step;
          if (step !== "quiz") quizGraded = null;
          render();
        });
      });
      const grade = document.getElementById("grade-quiz");
      if (grade) grade.addEventListener("click", gradeQuiz);
      const redo = document.getElementById("redo-quiz");
      if (redo) redo.addEventListener("click", () => {
        quizPick = {};
        quizGraded = null;
        forceQuiz = true;
        render();
      });
      document.querySelectorAll("input[type=radio]").forEach(input => {
        input.addEventListener("change", () => {
          const i = Number(input.name.slice(1));
          quizPick[i] = Number(input.value);
        });
      });
      const gn = document.getElementById("grade-num");
      if (gn) gn.addEventListener("click", gradeNum);
      const sn = document.getElementById("show-num");
      if (sn) sn.addEventListener("click", () => {
        numShown = true;
        render();
      });
    }
    function gradeQuiz() {
      const lesson = lessonById(view.id);
      let score = 0;
      lesson.quiz.forEach((item, i) => {
        if (quizPick[i] === item.answer) score += 1;
      });
      const ok = score >= 3;
      quizGraded = { id: lesson.id, score, ok };
      if (ok) {
        state.quiz[lesson.id] = true;
        forceQuiz = false;
        stampCerts();
      }
      render();
    }
    function gradeNum() {
      const lesson = lessonById(view.id);
      const n = lesson.numerical;
      const values = {};
      let ok = true;
      n.fields.forEach(f => {
        const el = document.querySelector(`[data-field="${f.key}"]`);
        values[f.key] = el ? el.value : "";
        if (n.kind === "sop") {
          if (normSop(values[f.key]) !== SOP_OK) ok = false;
        } else {
          const x = parseFloat(String(values[f.key]).replace(",", "."));
          if (!Number.isFinite(x) || Math.abs(x - f.target) > f.tol) ok = false;
        }
      });
      const out = document.getElementById("num-out");
      if (ok) {
        state.num[lesson.id] = true;
        numShown = true;
        stampCerts();
        render();
      } else if (out) {
        out.innerHTML = `<p class="bad">Not yet. Check the sign and the unit.</p>`;
      }
    }
    render();
  </script>
</body>
</html>
